x;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}.timeout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:14px auto}.timeout-team{border:1px solid #334157;border-radius:14px;padding:13px;text-align:center}.timeout-team button{margin-top:10px;width:100%}.timeout-active{font-size:3.5rem;color:#ffb047;font-weight:900;text-align:center}.timeout-center{text-align:center}.timeout-actions{margin-top:14px}.settings-grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:15px}.setting-item{display:flex;flex-direction:column;gap:7px;min-width:120px}.setting-item label{font-size:.84rem;color:#c0cce0}.setting-item input[type=text]{width:180px}.settings-actions{margin-top:20px}.status{text-align:center;min-height:25px;margin-top:16px;color:#ffbf69}.footer{text-align:center;color:#8596b1;font-size:.75rem;margin-top:15px}.hidden{display:none!important}@media(max-width:1000px){.main{grid-template-columns:minmax(0,1fr) minmax(210px,.9fr) minmax(0,1fr);gap:12px}.team{min-height:390px}.score{font-size:clamp(5rem,11vw,8rem)}.clocktime{font-size:clamp(3.6rem,7.6vw,6rem)}.score-actions button{font-size:.95rem;min-height:49px}.foul-row{gap:7px}.foul-row button{min-width:38px;padding:6px}.clock{gap:18px}.period{gap:7px}.period button{min-width:36px;padding:7px}}@media(max-width:700px){.app{padding:15px 10px 26px}.header{margin-bottom:14px}.brand{letter-spacing:.09em}.pill{font-size:.66rem;padding:6px 8px}.main{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home{grid-column:1;grid-row:1}.away{grid-column:2;grid-row:1}.clock{grid-column:1/-1;grid-row:2;gap:12px;padding:17px 0 5px}.team{min-height:285px;border-radius:17px;padding:12px 8px}.team-name{padding-top:3px;font-size:clamp(1rem,4.8vw,1.7rem)}.score{font-size:clamp(4.5rem,20vw,7.5rem);margin:14px 0}.score-actions{gap:4px}.score-actions button{font-size:.95rem;min-height:46px;padding:6px 0}.foul-row{margin-top:15px;padding-top:12px;gap:6px}.foul-row .caption /* V4.1: V3 original three-column layout, with time controls centered. */
.main{grid-template-columns:minmax(0,1fr) minmax(320px,1.12fr) minmax(0,1fr);align-items:stretch}
.clock{justify-content:flex-start;gap:18px;padding:46px 0 0}
.clocktime{font-size:clamp(4.5rem,7.2vw,8rem)}
.middle-tools{width:100%;display:grid;gap:12px;margin-top:10px}
.center-panel{width:100%;border:1px solid #303c50;background:#192130;border-radius:16px;padding:14px 12px;text-align:center;min-width:0}
.center-panel summary{cursor:pointer;list-style:none;font-weight:800;font-size:.82rem;letter-spacing:.12em;color:#b8c9e6}
.center-panel summary::-webkit-details-marker{display:none}
.center-panel summary::before{content:'▾ ';color:#ffb047}
.center-panel:not([open]) summary::before{content:'▸ '}
.center-panel .panel-body{padding:12px 0 0}
.center-panel .shot-row{gap:9px}
.center-panel .shot-number{font-size:3.6rem;min-width:70px}
.center-panel .shot-controls{gap:7px}
.center-panel .shot-controls button{padding:8px 10px;min-height:43px;font-size:.82rem}
.center-panel .muted{font-size:.74rem}
.center-panel .timeout-active{font-size:2.8rem}
.center-panel .timeout-grid{gap:8px;margin:10px auto}
.center-panel .timeout-team{padding:9px 7px;font-size:.78rem}
.center-panel .timeout-team button{padding:7px 4px;font-size:.78rem;min-height:44px}
.center-panel .timeout-actions button{min-height:43px;font-size:.78rem;padding:7px 10px}
.center-panel .check{font-size:.82rem}
@media(max-width:1100px) and (min-width:701px){
 .main{grid-template-columns:minmax(0,1fr) minmax(270px,1.08fr) minmax(0,1fr);gap:10px}
 .clock{padding-top:28px;gap:13px}
 .clocktime{font-size:clamp(3.7rem,6.5vw,6rem)}
 .middle-tools{gap:9px}.center-panel{padding:11px 8px}
 .center-panel .shot-number{font-size:3rem}
 .center-panel .shot-controls button{padding:6px 7px}
}
@media(max-width:700px){
 .main{grid-template-columns:repeat(2,minmax(0,1fr))}
 .clock{grid-column:1/-1;grid-row:2;padding:15px 0 0;gap:12px}
 .clocktime{font-size:clamp(4.4rem,17vw,7rem)}
 .middle-tools{grid-template-columns:1fr;max-width:540px;gap:10px;margin-top:6px}

}
@media(min-width:701px) and (max-height:600px){.clock{padding-top:12px}.center-panel .panel-body{padding-top:8px}}

/* V4.3: Timeout next to fouls; shared clock display. */
.team-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(95px,.75fr);gap:8px;align-items:center;border-top:1px solid #303c50;margin-top:22px;padding-top:16px}
.team-bottom .foul-row{border:0;margin:0;padding:0;gap:7px}.team-bottom .team-timeouts{margin:0}.team-bottom .foul-row button{min-width:38px;min-height:45px;padding:6px}.team-bottom .foul-row b{font-size:1.45rem}
@media(max-width:1050px){.team-bottom{grid-template-columns:1fr;gap:8px}}
@media(max-width:700px){.team-bottom{grid-template-columns:1fr;gap:6px;margin-top:10px;padding-top:10px}}
.team{position:relative}.foul-row{justify-content:center;flex-wrap:wrap;margin-top:22px}
.team-timeouts{margin-top:10px}.team-timeout-btn{width:100%;background:#725021;border-color:#a8732b;color:#fff0d1;min-height:48px;font-size:.88rem;letter-spacing:.04em}
.team-timeout-btn b{display:inline-grid;place-items:center;background:#ffb047;color:#151b26;border-radius:999px;min-width:24px;height:24px;margin-left:5px}
.timeout-context{display:flex;flex-direction:column;gap:4px;align-items:center;color:#ffca7a;font-weight:750;font-size:.85rem}
.clocktime.timeout-mode{color:#ffb047}.clocktime.timeout-mode.expired{color:#ff8c8c}
#timeoutActions button{min-height:54px}
@media(min-width:701px){.team{min-height:480px}.clock{gap:16px}}
@media(max-width:700px){.team-timeout-btn{font-size:.73rem;min-height:44px;padding:6px 3px}.team-timeout-btn b{min-width:20px;height:20px;margin-left:2px}.foul-row{margin-top:10px}}

/* V4.3: Center scores visually between team names and score buttons.
   The bottom controls remain in their original positions. */
.team .score{
  flex:1 1 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  margin:0;
  padding:0 0 clamp(20px,3.2vw,52px);
  font-size:clamp(6.3rem,12.65vw,12.7rem);
  line-height:1;
  font-variant-numeric:tabular-nums;
}
@media(max-width:1000px){
  .team .score{font-size:clamp(5.2rem,11.6vw,8.4rem);padding-bottom:clamp(12px,2vw,28px)}
}
@media(max-width:700px){
  .team .score{font-size:clamp(4.6rem,20.8vw,7.8rem);padding-bottom:8px}
}
@media(max-width:370px){
  .team .score{font-size:4.25rem;padding-bottom:5px}
}
@media(orientation:landscape) and (max-height:500px){
  .team .score{font-size:clamp(4.1rem,11.5vw,7.2rem);padding-bottom:5px}
}
.break-context{color:#ffcb82;font-weight:800;font-size:.9rem}.clocktime.break-mode{color:#ffb047}@media(max-width:700px){.clock .actions button{min-height:48px}}
</style></head><body><main class="app"><header class="header"><div class="brand">COURTSIDE <span>/</span> SCOREBOARD</div><div class="pill">V4.4 · OFFLINE READY</div></header><div class="main">
<article class="team home"><div class="team-name" id="name0">HOME</div><div class="score" id="score0">0</div><div class="score-actions"><button data-score="0,-1">−</button><button data-score="0,1">+1</button><button data-score="0,2">+2</button><button data-score="0,3">+3</button></div><div class="team-bottom"><div class="foul-row"><span class="caption">FOULS</span><button data-foul-minus="0">−</button><b id="fouls0">0</b><button data-foul="0">+</button></div><div class="team-timeouts"><button class="team-timeout-btn" data-timeout="0">TIMEOUT <b id="toLeft0">3</b></button></div></div></article>
<section class="clock"><div class="eyebrow" id="clockLabel">GAME CLOCK</div><div class="clocktime" id="gameClock" role="timer">10:00</div><div class="timeout-context hidden" id="timeoutContext"><span id="timeoutOwner">Timeout</span><span id="timeoutStatus">Running</span></div><div class="period" id="periodControls"><button id="prevPeriod" aria-label="Previous period">‹</button><span id="periodBadge">QUARTER 1</span><button id="nextPeriod" aria-label="Next period">›</button></div><div class="actions" id="gameActions"><button class="primary" id="gameStart">Start</button><button id="gameReset">Reset clock</button></div><div class="actions hidden" id="breakActions"><button class="primary" id="breakStart">Start Break</button><button id="breakSkip">Skip Break</button></div><div class="actions hidden" id="breakRunningActions"><button class="primary" id="breakToggle">Pause Break</button><button id="breakEnd">End Break</button></div><div class="actions hidden" id="timeoutActions"><button class="primary" id="timeoutToggle">Pause Timeout</button><button id="timeoutEnd">End Timeout</button></div><div class="middle-tools"><details class="center-panel shot-panel" open><summary>SHOT CLOCK</summary><div class="panel-body"><div class="shot-row"><label class="check"><input type="checkbox" id="shotEnabled">Enable</label><div class="shot-number" id="shotClock">24</div><div class="shot-controls"><button id="shot24">Reset 24</button><button id="shot14">Reset 14</button><button id="shotToggle">Start shot</button><button id="shotPause">Pause shot</button></div><span class="muted">Runs with game clock when enabled.</span></div></div></details>

</div></section>
<article class="team away"><div class="team-name" id="name1">AWAY</div><div class="score" id="score1">0</div><div class="score-actions"><button data-score="1,-1">−</button><button data-score="1,1">+1</button><button data-score="1,2">+2</button><button data-score="1,3">+3</button></div><div class="team-bottom"><div class="foul-row"><span class="caption">FOULS</span><button data-foul-minus="1">−</button><b id="fouls1">0</b><button data-foul="1">+</button></div><div class="team-timeouts"><button class="team-timeout-btn" data-timeout="1">TIMEOUT <b id="toLeft1">3</b></button></div></div></article></div>
<details class="panel" open><summary>Game settings</summary><div class="panel-body"><div class="settings-grid"><div class="setting-item"><label for="team0">Home team</label><input type="text" id="team0" maxlength="30"></div><div class="setting-item"><label for="team1">Away team</label><input type="text" id="team1" maxlength="30"></div><div class="setting-item"><label for="quarterMinutes">Quarter (min)</label><input type="number" id="quarterMinutes" min="0" max="99"></div><div class="setting-item"><label for="quarterSeconds">Extra seconds</label><input type="number" id="quarterSeconds" min="0" max="59"></div><div class="setting-item"><label for="overtimeMinutes">Overtime (min)</label><input type="number" id="overtimeMinutes" min="1" max="30"></div><div class="setting-item"><label for="shortBreak">Quarter break (min)</label><input type="number" id="shortBreak" min="0" max="60" step="1"></div><div class="setting-item"><label for="halfBreak">Halftime (min)</label><input type="number" id="halfBreak" min="0" max="60" step="1"></div><div class="setting-item"><label for="otBreak">Before overtime (min)</label><input type="number" id="otBreak" min="0" max="60" step="1"></div><div class="setting-item"><label for="timeoutDuration">Timeout (seconds)</label><input type="number" id="timeoutDuration" min="1" max="600"></div><div class="setting-item"><label for="timeoutLimit">Timeouts per team</label><input type="number" id="timeoutLimit" min="0" max="20"></div><label class="check"><input type="checkbox" id="autoShot">Auto-start shot clock</label></div><div class="actions settings-actions"><button id="saveSettings">Apply settings</button><button id="undoTimeout">Undo timeout</button><button class="red" id="newMatch">New game</button></div></div></details><div class="status" id="status" aria-live="polite"></div><div class="footer">Saved on this device · Timers pause when the page is hidden</div></main><script src="./app.js" defer></script></body></html>
